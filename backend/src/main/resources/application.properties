spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/greenthumb
spring.datasource.username=greenthumb
spring.datasource.password=greenthumb

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html

# Dev-only default; override with the APP_JWT_SECRET env var for any non-local deployment.
app.jwt.secret=${APP_JWT_SECRET:dev-only-local-jwt-signing-secret-please-rotate-before-any-real-deployment-0123456789}
app.jwt.expiration=PT24H

# Local dev stand-in for S3 (MinIO container in docker-compose.yml). Swap for real S3 later by
# removing the endpoint override and switching to IAM auth - StorageService is the seam.
app.storage.endpoint=${APP_STORAGE_ENDPOINT:http://localhost:9000}
app.storage.access-key=${APP_STORAGE_ACCESS_KEY:greenthumb}
app.storage.secret-key=${APP_STORAGE_SECRET_KEY:greenthumb-dev-secret}
app.storage.bucket=${APP_STORAGE_BUCKET:greenthumb-photos}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# No dev-only fallback - there is no safe placeholder for a real API key. Local dev calling the
# ai/photo-diagnosis endpoints must set OPENAI_API_KEY - copy backend/.env.local.example to
# backend/.env.local (gitignored) and `make backend-start`/`make up` will load it automatically.
# Swap for Bedrock IAM auth later behind the AiClient interface.
app.openai.api-key=${OPENAI_API_KEY:}
