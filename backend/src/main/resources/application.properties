spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/greenthumb
spring.datasource.username=greenthumb
spring.datasource.password=greenthumb

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html

# Dev-only default; override with the APP_JWT_SECRET env var for any non-local deployment.
app.jwt.secret=${APP_JWT_SECRET:dev-only-local-jwt-signing-secret-please-rotate-before-any-real-deployment-0123456789}
app.jwt.expiration=PT24H
