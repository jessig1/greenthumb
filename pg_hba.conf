# Local-only dev database - trust any host that can reach the container at all. Mounted outside
# the data directory (see docker-compose.yml's `command: -c hba_file=...`) so it survives even
# though initdb would otherwise regenerate a much narrower default on first init.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             0.0.0.0/0               trust
host    all             all             ::/0                    trust
