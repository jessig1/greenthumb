services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: greenthumb
      POSTGRES_USER: greenthumb
      POSTGRES_PASSWORD: greenthumb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenthumb -d greenthumb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
